spring:
  application:
    name: minicloud
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

minicloud:
  phase: 8
  hypervisor:
    type: libvirt
    uri: qemu:///system
    storage-pool: default
    storage-pool-path: /var/lib/libvirt/images
    emulator: /usr/bin/qemu-system-x86_64
  security:
    jwt-expiration-ms: 86400000
    jwt-secret: ${MINICLOUD_JWT_SECRET:dev-only-change-this-secret-key-32b!!}
  bootstrap:
    admin:
      username: ${MINICLOUD_ADMIN_USER:admin}
      password: ${MINICLOUD_ADMIN_PASSWORD:ChangeMe!Admin}
      display-name: MiniCloud Administrator
    operator:
      username: ${MINICLOUD_OPERATOR_USER:operator}
      password: ${MINICLOUD_OPERATOR_PASSWORD:ChangeMe!Operator}
      display-name: MiniCloud Operator
    viewer:
      username: ${MINICLOUD_VIEWER_USER:viewer}
      password: ${MINICLOUD_VIEWER_PASSWORD:ChangeMe!Viewer}
      display-name: MiniCloud Viewer
