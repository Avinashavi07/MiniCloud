spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/minicloud}
    username: ${SPRING_DATASOURCE_USERNAME:minicloud}
    password: ${SPRING_DATASOURCE_PASSWORD:minicloud}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

logging:
  level:
    root: INFO
    com.minicloud: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

minicloud:
  security:
    cors-allowed-origins: http://localhost:5173,http://127.0.0.1:5173
